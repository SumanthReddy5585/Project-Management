# Render Blueprint for O2 Support Hub: one free web service (API + web app on one HTTPS address).
# Database: point DATABASE_URL at any PostgreSQL 14+ (Neon's free tier does not expire; Render's free
# Postgres is deleted after 30 days). Files are stored in the database because free instances have no disk.
# Deploy: Render dashboard → New → Blueprint → pick this repository.
services:
  - type: web
    name: meridian
    runtime: node
    plan: free
    region: singapore
    buildCommand: cd frontend && npm ci --include=dev && npm run build && cd ../backend && npm ci --omit=dev
    startCommand: cd backend && node scripts/db-migrate.js && node scripts/seed-if-empty.js && node src/server.js
    healthCheckPath: /ready
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: COOKIE_SECURE
        value: "true"
      - key: TRUST_PROXY
        value: "1"
      - key: SERVE_WEB_DIR
        value: ../frontend/dist
      # Free instances have no persistent disk, so uploads live in Postgres (FileBlob table).
      - key: STORAGE_DRIVER
        value: db
      - key: APP_NAME
        value: O2 Support Hub
      - key: LOG_LEVEL
        value: info
      # Set in the dashboard: the connection string of your PostgreSQL (e.g. Neon). Never commit it.
      - key: DATABASE_URL
        sync: false
      # Optional email: smtps://user:key@smtp-relay.brevo.com:465 (or any SMTP). Without it, in-app only.
      - key: SMTP_URL
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: ALLOW_DEMO_SEED
        value: "true"
      # Prompted when the blueprint is created; used for every demo account. Keep it private.
      - key: DEMO_PASSWORD
        sync: false

