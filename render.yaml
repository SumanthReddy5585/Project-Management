# Render Blueprint: one free web service (API + web app on one HTTPS address) + one free PostgreSQL.
# Deploy: Render dashboard → New → Blueprint → pick this repository.
services:
  - type: web
    name: meridian
    runtime: node
    plan: free
    region: singapore
    buildCommand: cd frontend && npm ci --include=dev && npm run build && cd ../backend && npm ci --omit=dev
    startCommand: cd backend && node scripts/db-migrate.js && node scripts/seed-if-empty.js && node src/server.js
    healthCheckPath: /ready
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: COOKIE_SECURE
        value: "true"
      - key: TRUST_PROXY
        value: "1"
      - key: SERVE_WEB_DIR
        value: ../frontend/dist
      # Render's free instances have no persistent disk: uploaded files are lost on restart/redeploy.
      - key: UPLOAD_DIR
        value: /tmp/meridian-uploads
      - key: LOG_LEVEL
        value: info
      - key: DATABASE_URL
        fromDatabase:
          name: meridian-db
          property: connectionString
      - key: ALLOW_DEMO_SEED
        value: "true"
      # Prompted when the blueprint is created; used for every demo account. Keep it private.
      - key: DEMO_PASSWORD
        sync: false

databases:
  - name: meridian-db
    plan: free
    region: singapore
    databaseName: meridian
    user: meridian
