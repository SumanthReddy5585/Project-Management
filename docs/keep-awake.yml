# Copy to .github/workflows/keep-awake.yml to ping the free Render service so it doesn't sleep.
# GitHub may delay scheduled runs and pauses them after 60 days without repository activity.
name: keep-awake
on:
  schedule: [{ cron: '*/10 * * * *' }]
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS --max-time 90 https://meridian-quki.onrender.com/health || true
