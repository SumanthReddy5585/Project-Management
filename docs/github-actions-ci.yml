name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: pm, POSTGRES_PASSWORD: pm_ci_pw, POSTGRES_DB: pm_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pm" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://pm:pm_ci_pw@localhost:5432/pm_test
      TEST_DATABASE_URL: postgresql://pm:pm_ci_pw@localhost:5432/pm_test
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: backend/package-lock.json }
      - run: npm ci
      - run: npx prisma validate && npx prisma generate
      - run: npx prisma migrate deploy
      - name: Check migrations match the schema
        env: { SHADOW_DATABASE_URL: "postgresql://pm:pm_ci_pw@localhost:5432/pm_shadow" }
        run: |
          PGPASSWORD=pm_ci_pw psql -h localhost -U pm -d pm_test -c 'CREATE DATABASE pm_shadow;'
          npx prisma migrate diff --from-migrations prisma/migrations --to-schema prisma/schema.prisma --exit-code
      - run: npm test

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: pm, POSTGRES_PASSWORD: pm_ci_pw, POSTGRES_DB: pm_e2e }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U pm" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://pm:pm_ci_pw@localhost:5432/pm_e2e
      JOBS_ENABLED: "false"
      LOG_LEVEL: warn
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: cd backend && npm ci && npx prisma generate && npx prisma migrate deploy && npm run seed:demo
      - run: cd backend && (node src/server.js &) && sleep 3
      - run: cd frontend && npm ci && npx playwright install --with-deps chromium
      - run: cd frontend && (npx vite --port 5173 &) && sleep 5 && npx playwright test
