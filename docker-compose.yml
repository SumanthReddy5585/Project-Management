# Local, production-like stack: PostgreSQL + API + nginx-served web app on http://localhost:8080
# Uploaded files persist in the `uploads` volume; database data in `pgdata`.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local}
      POSTGRES_DB: pm
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pm -d pm"]
      interval: 5s
      retries: 10
  api:
    build: ./backend
    depends_on: { db: { condition: service_healthy } }
    environment:
      # Local HTTP only. For real deployments use NODE_ENV=production behind TLS (see docs/OPERATIONS.md).
      NODE_ENV: development
      DATABASE_URL: postgresql://pm:${POSTGRES_PASSWORD:-change-me-local}@db:5432/pm
      APP_ORIGIN: http://localhost:8080
      CORS_ORIGINS: http://localhost:8080
      COOKIE_SECURE: "false"
      TRUST_PROXY: "1"
      UPLOAD_DIR: /app/uploads
      LOG_LEVEL: info
    volumes: [uploads:/app/uploads]
  web:
    build: ./frontend
    depends_on: [api]
    ports: ["8080:8080"]
volumes:
  pgdata:
  uploads:
